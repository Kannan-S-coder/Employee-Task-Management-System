# ===================================================
# Application Configuration
# ===================================================
spring.application.name=employee-task-management
server.port=8080

# ===================================================
# MySQL DataSource Configuration
# Change spring.datasource.password to match your local MySQL root password
# (or provide DB_PASSWORD environment variable)
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_task_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# Spring Data JPA / Hibernate Configuration
# ddl-auto=update automatically creates or updates tables
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

